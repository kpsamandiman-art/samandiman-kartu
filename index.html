<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kartu Anggota Samandiman</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f2f0eb;font-family:Arial,sans-serif;color:#171717}
.wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.card{width:min(430px,100%);background:#111;border-radius:22px;overflow:hidden;box-shadow:0 12px 35px #0002;color:#fff}
.top{padding:22px 24px 18px;border-bottom:1px solid #b99a52;background:linear-gradient(135deg,#111,#252116)}
.brand{display:flex;align-items:center;gap:13px}.logo{width:58px;height:58px;border-radius:50%;object-fit:cover;background:#fff}
.brand h1{font-size:18px;margin:0;color:#d8b86a}.brand p{font-size:11px;margin:4px 0 0;letter-spacing:1px}
.content{padding:24px}.photo{width:132px;height:164px;object-fit:cover;border-radius:12px;display:block;margin:0 auto 18px;background:#333}
.label{font-size:10px;color:#b99a52;letter-spacing:1.5px;margin-top:12px}.value{font-size:16px;font-weight:700;margin-top:4px}.id{font-size:13px;color:#ddd}
.qr{width:112px;height:112px;background:#fff;padding:7px;margin:20px auto 4px;display:block}
.footer{text-align:center;padding:14px;color:#b99a52;font-size:10px;letter-spacing:1px;border-top:1px solid #333}
.status{display:inline-block;margin-top:10px;padding:5px 12px;border-radius:20px;background:#d8b86a;color:#111;font-size:11px;font-weight:bold}
.note{text-align:center;font-size:11px;color:#666;margin-top:14px}
</style></head>
<body><div class="wrap"><div>
<div class="card"><div class="top"><div class="brand">
<img class="logo" src="https://drive.google.com/uc?export=view&id=1dwQAUE1gP4RJUH3gBrmEyd5OiYfumwsO" alt="Logo Samandiman">
<div><h1>KAMPUNG PENGETAHUAN SAMANDIMAN</h1><p>BELAJAR • BERTUMBUH • MENGINSPIRASI</p></div>
</div></div><div class="content">
<img class="photo" src="https://drive.google.com/uc?export=view&id=12ZRGY0MgZ4mQayj1EnVmELKe2z7h5EAb" alt="Foto anggota">
<div class="label">NAMA ANGGOTA</div><div class="value">Reza Andik Setiawan</div>
<div class="label">ID ANGGOTA</div><div class="value id">SMD-ANG-0001</div>
<div class="label">STATUS</div><span class="status">AKTIF</span>
<img class="qr" src="https://quickchart.io/qr?text=https%3A%2F%2Fsites.google.com%2Fview%2Fkampungpengetahuansamandiman%2Fkartu-anggota&size=180" alt="QR Kartu Anggota">
</div><div class="footer">KARTU ANGGOTA DIGITAL • SAMANDIMAN</div></div>
<div class="note">Prototype kartu anggota SMD-ANG-0001</div></div></div></body></html>
